server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json;

  # Resolve the `api` service at request time via Docker's embedded DNS, so the
  # proxy survives the api container getting a new IP on restart.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $api_upstream http://api:8000;

  # ---- PUBLIC front door (leave these on a Cloudflare Access "Bypass" policy) ----
  # Onboarding / request-access landing page (static file shipped in the SPA bundle).
  location = /welcome {
    try_files /welcome.html =404;
  }
  # Public intake endpoint the landing page posts to.
  location = /request-access {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  # ---- API reverse proxy: served under the SAME origin as the SPA, so a single
  #      Cloudflare Access login covers every request (no cross-subdomain cookie gap). ----

  # Streaming chat (SSE): buffering MUST be off so tokens flush token-by-token.
  location = /chat {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;          # long essay/artifact generations
    chunked_transfer_encoding on;
  }

  location = /health {
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location /sessions {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location /config {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location /artifacts {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  # Admin: access-request queue. Stays GATED (only Cloudflare-Access-approved users).
  location /admin {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  # SPA fallback — must stay last.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
